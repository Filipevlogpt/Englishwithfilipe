const UI={
 en:{home:'Home',brandTag:'Learn • Practice • Grow',heroTitle:'Learn. Practice. Speak.',heroText:'Build English through useful vocabulary, clear explanations, structured tests and real communication.',chooseLevel:'Choose your level',levelProgress:'Learn progressively from A1 to C1.',months:'months.',storyLead:'That\'s how long it took me to complete my Duolingo journey and reach a point where I could express myself in English.',practiceSecret:'But the real secret was practice.',storyP1:'Before I became a teacher, I was a learner. And I know what it feels like to learn English on your own.',storyHeading1:'I know what it feels like to learn English from scratch.',storyP2:'My name is Filipe. I\'m originally from Brazil, and I\'m currently based in Romania. Although I\'m new to teaching English professionally, I\'m not new to English or international environments. Over the years, I\'ve had the opportunity to work with multinational companies such as Booking.com, TAP Airport, Radisson Blu, and several other European companies in Portugal. These experiences taught me how important English can be when it comes to work, travel, communication, and meeting people from all over the world.',storyP3:'About 10 years ago, I started learning English completely on my own. I began with apps like Duolingo and gradually built my confidence and communication skills. So I understand the challenges that come with learning a new language — the doubts, the fear of making mistakes, and that feeling of ‘I know what I want to say, but I just can\'t find the words!’',storyHeading2:'So, why not learn English together?',storyP4:'That\'s why I want to make your English-learning journey simpler, more practical, and less stressful. My goal is not just to help you learn grammar or memorize vocabulary. I want to help you feel comfortable speaking English, express yourself naturally, and gain the confidence to use English wherever life takes you — whether you\'re travelling, working, meeting new people, or simply having a conversation.',storyP5:'I believe that making mistakes is a normal and necessary part of learning. My lessons are a space where you can practice, ask questions, make mistakes, laugh, and improve without feeling embarrassed. If you\'re looking for a friendly, patient, and enthusiastic teacher who understands what it\'s like to learn English from the beginning, I\'d love to meet you! Book a trial lesson with me, and let\'s start improving your English together. I can\'t wait to meet you! — Filipe S.',learnInput:'Learn — Input',practiceControlled:'Practice — Controlled practice',speakImportant:'Speak — The most important part',correctConfidence:'Correct — Without killing confidence',repeatAutomatic:'Repeat — Until it becomes automatic',methodLearnText:'Vocabulary, phrases, useful grammar, short dialogues, listening and reading.',methodPracticeText:'Write sentences, transform them, complete gaps, answer questions and read aloud.',methodSpeakText:'Use the language in questions, role-play, descriptions, opinions and conversations.',methodCorrectText:'Let the student communicate first, then correct the most important errors and try again.',methodRepeatText:'Revisit the same language in new contexts until the student can retrieve and use it naturally.',vocab:'Vocabulary',tests:'Tests',explain:'Explanations',dict:'3-Language Bank',method:'My Method',story:'My Story',teacher:'Teacher Lab',contact:'Contact',login:'Log in',logout:'Log out',search:'Search vocabulary...',all:'All types',noResults:'No results found.',explainEyebrow:'Grammar & language explained',explainTitle:'Understand verbs, adjectives, grammar and more.',explainText:'Each explanation tells you what the item is, how it works, when to use it, common mistakes and examples.',examples:'Examples',how:'How to use',mistakes:'Common mistakes',start:'Start',question:'Question',of:'of',correct:'Correct.',wrong:'Not quite.',good:'Good work.',correctAnswer:'Correct answer:',next:'Next',finish:'Finish',c  pt:{home:'Início',brandTag:'Aprenda • Pratique • Cresça',heroTitle:'Aprenda. Pratique. Fale.',heroText:'Desenvolva seu inglês com vocabulário útil, explicações claras, testes estruturados e comunicação real.',chooseLevel:'Escolha seu nível',levelProgress:'Aprenda progressivamente do A1 ao C1.',months:'meses.',storyLead:'Foi esse o tempo que levei para concluir minha jornada no Duolingo e chegar a um ponto em que conseguia me expressar em inglês.',practiceSecret:'Mas o verdadeiro segredo foi a prática.',storyP1:'Antes de me tornar professor, eu era aluno. E sei como é aprender inglês sozinho.',storyHeading1:'Eu sei como é aprender inglês do zero.',storyP2:'Meu nome é Filipe, sou originalmente do Brasil e atualmente moro na Romênia. Embora seja novo no ensino profissional de inglês, não sou novo no inglês nem em ambientes internacionais. Ao longo dos anos, tive a oportunidade de trabalhar com empresas multinacionais como Booking.com, TAP Airport, Radisson Blu e várias outras empresas europeias em Portugal. Essas experiências me mostraram como o inglês pode ser importante para o trabalho, viagens, comunicação e para conhecer pessoas do mundo todo.',storyP3:'Há cerca de 10 anos, comecei a aprender inglês completamente sozinho. Comecei com aplicativos como o Duolingo e, aos poucos, desenvolvi minha confiança e minhas habilidades de comunicação. Por isso, entendo os desafios de aprender um novo idioma — as dúvidas, o medo de cometer erros e aquela sensação de “Eu sei o que quero dizer, mas simplesmente não consigo encontrar as palavras!”',storyHeading2:'Então, por que não aprender inglês juntos?',storyP4:'Por isso, quero tornar sua jornada de aprendizagem de inglês mais simples, prática e menos estressante. Meu objetivo não é apenas ajudar você a aprender gramática ou memorizar vocabulário. Quero ajudar você a se sentir confortável falando inglês, a se expressar naturalmente e a ganhar confiança para usar o inglês onde quer que a vida leve você — viajando, trabalhando, conhecendo novas pessoas ou simplesmente conversando.',storyP5:'Acredito que cometer erros é uma parte normal e necessária do aprendizado. Minhas aulas são um espaço onde você pode praticar, fazer perguntas, cometer erros, rir e melhorar sem se sentir envergonhado. Se você procura um professor amigável, paciente e entusiasmado, que entende como é aprender inglês desde o começo, eu adoraria conhecer você! Agende uma aula experimental comigo e vamos começar a melhorar seu inglês juntos. Mal posso esperar para conhecer você! — Filipe S.',learnInput:'Aprender — Input',practiceControlled:'Praticar — Prática controlada',speakImportant:'Falar — A parte mais importante',correctConfidence:'Corrigir — Sem destruir a confiança',repeatAutomatic:'Repetir — Até se tornar automático',methodLearnText:'Vocabulário, frases, gramática útil, diálogos curtos, listening e leitura.',methodPracticeText:'Escreva frases, transforme-as, complete lacunas, responda perguntas e leia em voz alta.',methodSpeakText:'Use o idioma em perguntas, role-plays, descrições, opiniões e conversas.',methodCorrectText:'Deixe o aluno se comunicar primeiro; depois corrija os erros mais importantes e tente novamente.',methodRepeatText:'Revise a mesma linguagem em novos contextos até conseguir recuperá-la e usá-la naturalmente.',vocab:'Vocabulário',tests:'Testes',explain:'Explicações',dict:'Banco 3 Idiomas',method:'Meu Método',story:'Minha História',teacher:'Área do Professor',contact:'Contato',login:'Entrar',logout:'Sair',search:'Pesquisar vocabulário...',all:'Todos os tipos',noResults:'Nenhum resultado encontrado.',explainEyebrow:'Gramática e linguagem explicadas',explainTitle:'Entenda verbos, adjetivos, gramática e muito mais.',explainText:'Cada explicação mostra o que é, como funciona, quando usar, erros comuns e exemplos.',examples:'Exemplos',how:'Como usar',mistakes:'Erros comuns',start:'Começar',question:'Questão',of:'de',correct:'Correto.',wrong:'Não exatamente.',good:'Muito bem.',correctAnswer:'Resposta co  ro:{home:'Acasă',brandTag:'Învață • Exersează • Crește',heroTitle:'Învață. Exersează. Vorbește.',heroText:'Dezvoltă-ți engleza prin vocabular util, explicații clare, teste structurate și comunicare reală.',chooseLevel:'Alege nivelul',levelProgress:'Învață progresiv de la A1 la C1.',months:'luni.',storyLead:'Acesta este timpul de care am avut nevoie pentru a-mi finaliza parcursul Duolingo și pentru a ajunge la un punct în care mă puteam exprima în engleză.',practiceSecret:'Dar adevăratul secret a fost practica.',storyP1:'Înainte să devin profesor, am fost elev. Știu cum este să înveți engleză singur.',storyHeading1:'Știu cum este să înveți engleză de la zero.',storyP2:'Mă numesc Filipe, sunt originar din Brazilia și în prezent locuiesc în România. Deși sunt nou în predarea profesională a limbii engleze, nu sunt nou în limba engleză sau în mediile internaționale. De-a lungul anilor, am avut ocazia să lucrez cu companii multinaționale precum Booking.com, TAP Airport, Radisson Blu și alte companii europene din Portugalia. Aceste experiențe m-au învățat cât de importantă poate fi engleza pentru muncă, călătorii, comunicare și pentru a întâlni oameni din întreaga lume.',storyP3:'Acum aproximativ 10 ani, am început să învăț engleză complet singur. Am început cu aplicații precum Duolingo și, treptat, mi-am construit încrederea și abilitățile de comunicare. Așa că înțeleg provocările care apar atunci când înveți o limbă nouă — îndoielile, teama de a face greșeli și acel sentiment de „Știu ce vreau să spun, dar pur și simplu nu găsesc cuvintele!”',storyHeading2:'Așadar, de ce să nu învățăm engleză împreună?',storyP4:'De aceea vreau să fac parcursul tău de învățare a limbii engleze mai simplu, mai practic și mai puțin stresant. Scopul meu nu este doar să te ajut să înveți gramatică sau să memorezi vocabular. Vreau să te ajut să te simți confortabil vorbind engleză, să te exprimi natural și să câștigi încrederea de a folosi engleza oriunde te duce viața — când călătorești, lucrezi, cunoști oameni noi sau pur și simplu ai o conversație.',storyP5:'Cred că a face greșeli este o parte normală și necesară a învățării. Lecțiile mele sunt un spațiu în care poți exersa, pune întrebări, face greșeli, râde și progresa fără să te simți jenat. Dacă îți dorești un profesor prietenos, răbdător și entuziast, care înțelege cum este să înveți engleză de la început, mi-ar plăcea să te cunosc! Programează o lecție de probă cu mine și hai să începem să îți îmbunătățim engleza împreună. Abia aștept să te cunosc! — Filipe S.',learnInput:'Învață — Input',practiceControlled:'Exersează — Practică controlată',speakImportant:'Vorbește — Cea mai importantă parte',correctConfidence:'Corectează — Fără să distrugi încrederea',repeatAutomatic:'Repetă — Până devine automat',methodLearnText:'Vocabular, expresii, gramatică utilă, dialoguri scurte, ascultare și citire.',methodPracticeText:'Scrie propoziții, transformă-le, completează spații, răspunde la întrebări și citește cu voce tare.',methodSpeakText:'Folosește limba în întrebări, jocuri de rol, descrieri, opinii și conversații.',methodCorrectText:'Lasă elevul să comunice mai întâi, apoi corectează cele mai importante greșeli și încearcă din nou.',methodRepeatText:'Reia aceeași limbă în contexte noi până când elevul o poate recupera și folosi natural.',vocab:'Vocabular',tests:'Teste',explain:'Explicații',dict:'Banca 3 limbi',method:'Metoda mea',story:'Povestea mea',teacher:'Zona profesorului',contact:'Contact',login:'Autentificare',logout:'Ieșire',search:'Caută vocabular...',all:'Toate tipurile',noResults:'Nu au fost găsite rezultate.',explainEyebrow:'Gramatică și limbaj explicate',explainTitle:'Înțelege verbe, adjective, gramatică și multe altele.',explainText:'Fiecare explicație arată ce este, cum funcționează, când se folosește, greșeli comune și exemple.',examples:'Exemple',how:'Cum se folosește',mistakes:'Greșeli comune',start:'Începe',question:'Întrebarea',of:'din',correct:'Corect.',wrong:'Nu chiar.',good:'Foarte bine.',correctAnswer:'Răspuns corect:',next:'Următoarea',finish:'Finalizează',complete:'Finalizat',score:'Scor:',another:'Alt test',review:'Recapitulează',dictEyebrow:'Engleză · Portugheză · Română',dictTitle:'Banca 3 limbi',dictText:'Vocabular de zi cu zi organizat pe nivel, fără repetarea termenului englezesc între niveluri.',dictSearch:'Caută în engleză, portugheză sau română...',teacherTitle:'Transformă greșelile în următoarea lecție.',teacherIntro:'Vezi performanța, greșelile exacte, temele și ce trebuie exersat.',students:'Elevi',completed:'Teste finalizate',average:'Media generală',bank:'Întrebări disponibile',openDiagnosis:'Deschide diagnosticul',contactTitle:'Contactează-l pe Filipe',contactText:'Întrebări, lecții sau colaborare? Contactează-mă.',methodTitle:'Metoda Filipe',storyLabel:'Despre mine',vocabLibrary:'Biblioteca de vocabular',uniqueItems:'elemente de învățare unice.',aiLab:'Laborator de teste',testsIntro:'Teste originale ENGLISHMETFILIPE.',testsDescription:'Exersează gramatica, vocabularul, citirea, exercițiile cloze, transformările și limbajul funcțional.',questionDescription:'întrebări cu feedback și scor final.',loading:'Se încarcă...',noStudents:'Nu există încă elevi înregistrați.',teacherLoadError:'Zona profesorului nu a putut fi încărcată.',example:'Exemplu',normal:'Normal',slow:'Lent',typeLabel:'Tip',topicLabel:'Temă',dailyUse:'utilizare zilnică',testsWord:'teste',loadingDiagnosis:'Se încarcă diagnosticul...',individualDiagnosis:'Diagnostic individual bazat pe răspunsurile incorecte.',errors:'erori',noMistakes:'Nu există încă greșeli înregistrate.',testHistory:'Istoricul testelor',noCompletedTests:'Nu există teste finalizate.',diagnosisError:'Diagnosticul nu a putut fi deschis.',footer:'ENGLISHMETFILIPE · Învață • Exersează • Crește'}

function t(k){return UI[lang]?.[k]||UI.en[k]||k} function $(s){return document.querySelector(s)} function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))} function levelName(l){return LEVEL_NAMES[lang]?.[l]||LEVEL_NAMES.en[l]||l}
function nav(){return `<header class="topbar"><div class="nav"><div class="brand" onclick="renderHome()"><div class="mark">EM</div><div><strong>ENGLISHMETFILIPE</strong><span>${t('brandTag')}</span></div></div><div class="navlinks"><button onclick="renderHome()">${t('home')}</button><button onclick="renderLearn()">${t('vocab')}</button><button onclick="renderTests()">${t('tests')}</button><button onclick="renderExplain()">${t('explain')}</button><button onclick="renderDict()">${t('dict')}</button><button onclick="renderMethod()">${t('method')}</button><button onclick="renderStory()">${t('story')}</button>${me?.role==='teacher'?`<button onclick="renderTeacher()">${t('teacher')}</button>`:''}<button class="contact-tab" onclick="renderContact()">◎ ${t('contact')}</button></div><div class="userbox"><select class="lang" onchange="setLang(this.value)"><option value="en" ${lang==='en'?'selected':''}>EN</option><option value="pt" ${lang==='pt'?'selected':''}>PT</option><option value="ro" ${lang==='ro'?'selected':''}>RO</option></select>${me?`<span class="chip">${esc(me.name)}</span><button onclick="logout()">${t('logout')}</button>`:`<button class="btn btn-green" onclick="openLogin()">${t('login')}</button>`}</div></div></header>`}
function heroTitleHTML(){const parts=t('heroTitle').split('. ');return parts.map((p,i)=>i===1?`<span>${esc(p)}.</span>`:esc(p)+(i<parts.length-1?'. ':'' )).join('')}
function route(view){activeView=view||'home';const f={home:renderHome,learn:()=>renderLearn(currentLevel),tests:renderTests,explain:renderExplain,dict:renderDict,method:renderMethod,story:renderStory,teacher:renderTeacher,contact:renderContact};(f[activeView]||renderHome)()}
function setLang(v){lang=v;localStorage.setItem('ewf_lang',v);document.documentElement.lang=v==='pt'?'pt-BR':v;document.title='ENGLISHMETFILIPE — '+(v==='pt'?'Aprenda • Pratique • Cresça':v==='ro'?'Învață • Exersează • Crește':'Learn • Practice • Grow');route(activeView)}
function renderHome(){activeView='home';$('#app').innerHTML=nav()+`<main><section class="hero"><div><div class="eyebrow">ENGLISHMETFILIPE</div><h1>${heroTitleHTML()}</h1><p>${t('heroText')}</p><div class="toolbar"><button class="btn btn-green" onclick="renderLearn()">${t('vocab')} →</button><button class="btn btn-yellow" onclick="renderTests()">${t('tests')} →</button></div></div><div class="hero-card"><div class="nine">9</div><div class="months">${t('months')}</div><p><strong>${t('storyLead')}</strong><br><br><strong>${t('practiceSecret')}</strong></p></div></section><section class="section"><div class="section-head"><div><div class="eyebrow">ENGLISHMETFILIPE</div><h2>${t('chooseLevel')}</h2><p>${t('levelProgress')}</p></div></div><div class="level-grid">${Object.entries(LEVELS).map(([l,x])=>`<div class="level ${x.cls}" onclick="renderLearn('${l}')"><h3>${l}</h3><p>${x.name}</p><span class="chip">${tests.filter(z=>z.level===l).length} ${t('testsWord')}</span></div>`).join('')}</div></section></main><footer class="footer">${t('footer')} · <a href="https://www.instagram.com/filipevlogpt/" target="_blank" rel="noopener">Instagram @filipevlogpt</a></footer>`}
function renderLearn(level=currentLevel){activeView='learn';currentLevel=level||currentLevel;const data=vocab.filter(x=>x.level===currentLevel);$('#app').innerHTML=nav()+`<main class="appview"><div class="section-head"><div><div class="eyebrow">${t('vocabLibrary')}</div><h2>${currentLevel} · ${levelName(currentLevel)}</h2><p>${data.length} ${t('uniqueItems')}</p></div></div><div class="toolbar"><input id="search" class="input" style="flex:1;min-width:220px" placeholder="${t('search')}" oninput="drawVocab()"><select id="type" class="select" onchange="drawVocab()"><option value="">${t('all')}</option>${[...new Set(data.map(x=>x.type))].sort().map(x=>`<option>${esc(x)}</option>`).join('')}</select>${Object.keys(LEVELS).map(l=>`<button class="btn ${l===currentLevel?'btn-green':'btn-ghost'}" onclick="renderLearn('${l}')">${l}</button>`).join('')}</div><div id="vocabCards" class="cards"></div></main>`;drawVocab()}
function drawVocab(){const data=vocab.filter(x=>x.level===currentLevel),q=($('#search')?.value||'').toLowerCase(),typ=$('#type')?.value||'';const arr=data.filter(x=>(!q||`${x.term} ${x.translation} ${x.topic}`.toLowerCase().includes(q))&&(!typ||x.type===typ));$('#vocabCards').innerHTML=arr.slice(0,500).map(x=>`<article class="card"><h3>${esc(x.term)}</h3><div class="translation">${esc(x.translation)}</div><div class="meta"><span>${t('typeLabel')}: ${esc(x.type)}</span><span>${t('topicLabel')}: ${esc(x.topic)}</span><span>${x.level}</span></div><div class="example"><strong>${t('example')}</strong><br>${esc(x.example)}</div><div class="audio-row"><button class="audio-btn" onclick="playAudio('/${x.audio.normal}',this)">▶ ${t('normal')}</button><button class="audio-btn" onclick="playAudio('/${x.audio.slow}',this)">${t('slow')}</button></div></article>`).join('')||`<div class="card">${t('noResults')}</div>`}
function playAudio(src,b){const old=b.textContent;const a=new Audio(src);b.disabled=true;b.textContent='Playing…';const restore=()=>{b.disabled=false;b.textContent=old};a.onended=restore;a.onerror=()=>{const term=b.closest('.card')?.querySelector('h3')?.textContent||'';if('speechSynthesis' in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(term);u.lang='en-US';u.rate=.72;u.onend=restore;u.onerror=restore;speechSynthesis.speak(u)}else restore()};a.play().catch(()=>a.onerror())}
function renderTests(){activeView='tests';$('#app').innerHTML=nav()+`<main class="appview"><div class="section-head"><div><div class="eyebrow">${t('aiLab')}</div><h2>${t('testsIntro')}</h2><p>${t('testsDescription')}</p></div></div><div class="tests-grid">${Object.keys(LEVELS).map(l=>`<article class="test-card"><div class="num">${tests.filter(x=>x.level===l).length}</div><div class="chip">${l}</div><h3>${levelName(l)}</h3><p>10 ${t('questionDescription')}</p><button class="btn btn-yellow" onclick="startTest('${l}')">${t('start')} ${l} →</button></article>`).join('')}</div></main>`}
function startTest(level){if(!me||me.role!=='student'){openLogin(lang==='pt'?'Entre com uma conta de aluno para salvar o resultado.':lang==='ro'?'Autentifică-te ca elev pentru a salva rezultatul.':'Log in with a student account to save your result.');return}const pool=tests.filter(x=>x.level===level);quiz=pool[Math.floor(Math.random()*pool.length)];quizIndex=0;quizAnswers=[];currentLevel=level;renderQuestion()}
function renderQuestion(){const q=quiz.questions[quizIndex];$('#app').innerHTML=nav()+`<main class="appview"><div class="quiz"><div class="qnum">${quiz.level} · ${quiz.title} · ${t('question')} ${quizIndex+1} ${t('of')} 10</div><div class="progress"><i style="width:${((quizIndex+1)/10)*100}%"></i></div><div class="qstem">${esc(q.stem)}</div><div class="options">${q.options.map((o,i)=>`<button class="option" onclick="answer(${i})">${esc(o)}</button>`).join('')}</div><div id="qfeedback"></div></div></main>`}
function answer(i){const q=quiz.questions[quizIndex],bs=[...document.querySelectorAll('.option')];bs.forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('correct');if(j===i&&i!==q.answer)b.classList.add('wrong')});const correct=i===q.answer;quizAnswers.push({question:q.stem,term:q.term,skill:q.skill,topic:q.topic,correct,chosen:q.options[i],correct_answer:q.options[q.answer]});$('#qfeedback').innerHTML=`<div class="result">${correct?'🟢 '+t('correct'):'🔴 '+t('wrong')} ${correct?t('good'):`${t('correctAnswer')} <strong>${esc(q.options[q.answer])}</strong>.<br><small>${esc(q.explanation)}</small>`}</div><div class="toolbar" style="margin-top:14px"><button class="btn btn-green" onclick="nextQuestion()">${quizIndex===9?t('finish'):t('next')}</button></div>`}
async function nextQuestion(){if(quizIndex<9){quizIndex++;renderQuestion();return}const score=quizAnswers.filter(x=>x.correct).length;await fetch('/api/attempt',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({quiz_id:quiz.id,level:quiz.level,score,total:10,answers:quizAnswers})});$('#app').innerHTML=nav()+`<main class="appview"><div class="quiz"><div class="eyebrow">${t('complete')}</div><h2 style="font-family:Nunito;font-size:54px;margin:10px 0;color:var(--green)">${score}/10</h2><p>${t('score')} <strong>${score*10}%</strong>.</p><div class="toolbar"><button class="btn btn-green" onclick="renderTests()">${t('another')}</button><button class="btn btn-yellow" onclick="renderLearn('${quiz.level}')">${t('review')} ${quiz.level}</button></div></div></main>`}
const CAT_UI={en:{'grammar & language':'Grammar & language','parts of speech':'Parts of speech','grammar':'Grammar'},pt:{'grammar & language':'Gramática e linguagem','parts of speech':'Classes de palavras','grammar':'Gramática'},ro:{'grammar & language':'Gramatică și limbaj','parts of speech':'Părți de vorbire','grammar':'Gramatică'}};
function explainSearchPlaceholder(){return lang==='pt'?'Pesquise verbo, adjetivo, substantivo ou gramática...':lang==='ro'?'Caută verb, adjectiv, substantiv sau gramatică...':'Search verb, adjective, noun or grammar...'}
function renderExplain(){activeView='explain';const cats=[...new Set(explanations.map(x=>x.category||'grammar'))].sort();$('#app').innerHTML=nav()+`<main class="appview"><div class="section-head"><div><div class="eyebrow">${t('explainEyebrow')}</div><h2>${t('explainTitle')}</h2><p>${t('explainText')}</p></div></div><div class="toolbar"><input id="explainSearch" class="input" style="flex:1;min-width:240px" placeholder="${lang==='pt'?'Pesquisar verb, adjective, noun, grammar...':lang==='ro'?'Caută verb, adjectiv, substantiv, gramatică...':'Search verb, adjective, noun, grammar...'}" oninput="drawExplain()"><select id="explainLevel" class="select" onchange="drawExplain()"><option value="">${lang==='pt'?'Todos os níveis':lang==='ro'?'Toate nivelurile':'All levels'}</option>${Object.keys(LEVELS).map(l=>`<option value="${l}">${l}</option>`).join('')}</select><select id="explainCat" class="select" onchange="drawExplain()"><option value="">${lang==='pt'?'Todas as categorias':lang==='ro'?'Toate categoriile':'All categories'}</option>${cats.map(c=>`<option value="${esc(c)}">${esc((CAT_UI[lang]||CAT_UI.en)[c]||c)}</option>`).join('')}</select></div><div id="explainCount" class="language-note"></div><div id="explainCards" class="explain-grid"></div></main>`;drawExplain()}
function drawExplain(){const q=($('#explainSearch')?.value||'').toLowerCase().trim(),lv=$('#explainLevel')?.value||'',cat=$('#explainCat')?.value||'';const arr=explanations.filter(x=>(!lv||x.level===lv)&&(!cat||x.category===cat)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('#explainCount').textContent=`${arr.length} ${lang==='pt'?'explicações':lang==='ro'?'explicații':'explanations'}`;$('#explainCards').innerHTML=arr.map(x=>{const d=x.definition?.[lang]||x.definition?.en||'';const how=x.how_to_use?.[lang]||'';const mistakes=x.common_mistakes?.[lang]||'';const catName=(CAT_UI[lang]||CAT_UI.en)[x.category||'grammar']||x.category||'Grammar';return `<article class="explain-card"><div class="chip">${esc(x.level)} · ${esc(catName)}</div><h3>${esc(lang==='pt'?x.title_pt:lang==='ro'?x.title_ro:x.title_en)}</h3><div class="translation">${esc(x.title_en)}</div><p><strong>${lang.toUpperCase()}:</strong> ${esc(d)}</p><p><strong>${t('how')}:</strong> ${esc(how)}</p><p><strong>${t('mistakes')}:</strong> ${esc(mistakes)}</p><div class="example"><strong>${t('examples')}</strong><br>${(x.examples||[]).map(esc).join('<br>')}</div></article>`}).join('')||`<div class="card"><h3>${t('noResults')}</h3></div>`}
function renderDict(){activeView='dict';$('#app').innerHTML=nav()+`<main class="appview"><div class="section-head"><div><div class="eyebrow">${t('dictEyebrow')}</div><h2>${t('dictTitle')}</h2><p>${t('dictText')}</p></div></div><div class="toolbar"><input id="dictSearch" class="input" style="flex:1;min-width:240px" placeholder="${t('dictSearch')}" oninput="drawDict()"><select id="dictLevel" class="select" onchange="drawDict()"><option value="">${lang==='pt'?'Todos os níveis':lang==='ro'?'Toate nivelurile':'All levels'}</option>${Object.keys(LEVELS).map(l=>`<option value="${l}">${l} · ${levelName(l)}</option>`).join('')}</select></div><div id="dictCount" class="language-note"></div><div id="dictCards" class="dict-grid"></div></main>`;drawDict()}
function drawDict(){const q=($('#dictSearch')?.value||'').toLowerCase().trim(),lv=$('#dictLevel')?.value||'';const arr=tri.filter(x=>(!lv||x.level===lv)&&`${x.english} ${x.portuguese} ${x.romanian}`.toLowerCase().includes(q));$('#dictCount').textContent=`${arr.length} ${lang==='pt'?'termos encontrados':lang==='ro'?'termeni găsiți':'terms found'}`;$('#dictCards').innerHTML=arr.map(x=>`<article class="dict-card"><div class="chip">${esc(x.level)}</div><h3>${esc(x.english)}</h3><p><strong>PT:</strong> ${esc(x.portuguese||'—')}</p><p><strong>RO:</strong> ${esc(x.romanian||'—')}</p><small>${esc(x.type||t('vocab'))} · ${esc(x.topic||t('dailyUse'))}</small></article>`).join('')||`<div class="card">${t('noResults')}</div>`}
function renderMethod(){activeView='method';$('#app').innerHTML=nav()+`<main class="appview"><div class="section-head"><div><div class="eyebrow">${t('method')}</div><h2>${t('methodTitle')}</h2></div></div><div class="cards"><article class="card"><h3>${t('learnInput')}</h3><p>${t('methodLearnText')}</p></article><article class="card"><h3>${t('practiceControlled')}</h3><p>${t('methodPracticeText')}</p></article><article class="card"><h3>${t('speakImportant')}</h3><p>${t('methodSpeakText')}</p></article><article class="card"><h3>${t('correctConfidence')}</h3><p>${t('methodCorrectText')}</p></article><article class="card"><h3>${t('repeatAutomatic')}</h3><p>${t('methodRepeatText')}</p></article></div></main>`}
function renderStory(){activeView='story';$('#app').innerHTML=nav()+`<main class="section"><div class="story"><div class="story-photo"><img src="/filipe-story.jpeg" alt="Filipe"></div><div class="story-copy"><div class="story-label">${t('storyLabel')}</div><div class="nine">9</div><div class="months">${t('months')}</div><p><strong>${t('storyLead')}</strong></p><p><strong>${t('practiceSecret')}</strong></p><p>${t('storyP1')}</p><h3 class="story-subheading">${t('storyHeading1')}</h3><p>${t('storyP2')}</p><p>${t('storyP3')}</p><p><strong>${t('storyP4')}</strong></p><h3 class="story-subheading">${t('storyHeading2')}</h3><p>${t('storyP5')}</p></div></div></main>`}
function renderContact(){activeView='contact';$('#app').innerHTML=nav()+`<main class="contact-page"><section class="contact-shell"><div class="contact-top"><div><span class="contact-kicker">✦ ${t('contact')}</span><h1>${t('contactTitle')}</h1><p class="lead">${t('contactText')}</p></div><div class="contact-orbit"><div class="orbit-ring"></div><div class="contact-core">EM</div></div></div><div class="contact-cards"><a class="contact-link" href="https://www.instagram.com/filipevlogpt/" target="_blank" rel="noopener"><div class="contact-icon">◎</div><div><strong>Instagram</strong><span>@filipevlogpt</span></div><div class="arrow">↗</div></a><a class="contact-link" href="mailto:Filipevlogpt@hotmail.com"><div class="contact-icon">✉</div><div><strong>E-mail</strong><span>Filipevlogpt@hotmail.com</span></div><div class="arrow">→</div></a></div></section></main>`}
async function renderTeacher(){activeView='teacher';if(!me||me.role!=='teacher'){openLogin('Teacher access required.');return}$('#app').innerHTML=nav()+`<main class="appview"><section class="teacher"><div class="eyebrow" style="color:var(--yellow)">${t('teacher')}</div><h2 style="font-family:Nunito;font-size:42px">${t('teacherTitle')}</h2><p style="color:#c9ddd6">${t('teacherIntro')}</p><div id="teacherLoading" class="notice">Loading...</div></section></main>`;try{const r=await fetch('/api/teacher/overview',{cache:'no-store'});if(!r.ok)throw new Error(await r.text());const d=await r.json(),students=d.students||[],avg=students.length?Math.round(students.reduce((a,s)=>a+s.average,0)/students.length):0;$('.teacher').innerHTML=`<div class="eyebrow" style="color:var(--yellow)">${t('teacher')}</div><h2 style="font-family:Nunito;font-size:42px">${t('teacherTitle')}</h2><p style="color:#c9ddd6">${t('teacherIntro')}</p><div class="statgrid"><div class="stat"><b>${students.length}</b><span>${t('students')}</span></div><div class="stat"><b>${students.reduce((a,s)=>a+s.tests,0)}</b><span>${t('completed')}</span></div><div class="stat"><b>${avg}%</b><span>${t('average')}</span></div><div class="stat"><b>${tests.length*10}</b><span>${t('bank')}</span></div></div><div style="margin-top:20px"><h3 style="font-family:Nunito">${t('students')}</h3><div id="studentList">${students.map(s=>`<div class="studentrow"><strong>${esc(s.name)}</strong><span>${esc(s.email)}</span><span>${s.tests} tests</span><span>${s.average}%</span><button class="btn btn-yellow" onclick="studentDetail(${s.id})">${t('openDiagnosis')}</button></div>`).join('')||`<div class="notice">${t('noStudents')}</div>`}</div><div id="detail"></div></div></section></main>`}catch(e){$('.teacher').innerHTML+=`<div class="notice">${t('teacherLoadError')} ${esc(e.message)}</div>`}}
async function studentDetail(id){const box=$('#detail');box.innerHTML=`<div class="notice">${t('loadingDiagnosis')}</div>`;try{const r=await fetch('/api/teacher/student?id='+encodeURIComponent(id),{cache:'no-store'});if(!r.ok)throw new Error(await r.text());const d=await r.json();box.innerHTML=`<div style="margin-top:28px"><h2 style="color:#fff;font-family:Nunito">${esc(d.student.name)}</h2><p style="color:#c9ddd6">${t('individualDiagnosis')}</p><div class="diagnosis">${(d.diagnosis||[]).map(x=>`<div class="diag"><b>${esc(x.skill)}</b><div style="color:var(--yellow);font-family:Nunito;font-size:25px;margin-top:5px">${x.count} ${t('errors')}</div><small style="color:#bcd4ca">${esc(x.topic)}</small><div class="recommend">${esc(x.recommendation)}</div></div>`).join('')||('<div class="diag">'+t('noMistakes')+'</div>')}</div><div style="margin-top:24px"><h3 style="font-family:Nunito;color:#fff">${t('testHistory')}</h3>${(d.attempts||[]).map(a=>`<div class="studentrow"><strong>${esc(a.level)}</strong><span>${esc(a.quiz_id)}</span><span>${a.score}/${a.total}</span><span>${esc(a.created_at)}</span></div>`).join('')||('<div class="diag">'+t('noCompletedTests')+'</div>')}</div></div>`}catch(e){box.innerHTML=`<div class="notice">${t('diagnosisError')} ${esc(e.message)}</div>`}}
function openLogin(msg=''){activeView=activeView||'home';$('#modal').classList.remove('hidden');$('#modal').innerHTML=`<div class="modalbox"><div style="display:flex;justify-content:space-between"><h2 style="font-family:Nunito">Welcome back.</h2><button class="btn btn-ghost" onclick="closeModal()">✕</button></div>${msg?`<div class="notice">${esc(msg)}</div>`:''}<div class="form" style="margin-top:14px"><input id="email" class="input" placeholder="Email"><input id="password" type="password" class="input" placeholder="Password"><button class="btn btn-green" onclick="login()">${t('login')}</button><button class="btn btn-ghost" onclick="showRegister()">Create student account</button></div></div>`}
function showRegister(){$('#modal').innerHTML=`<div class="modalbox"><div style="display:flex;justify-content:space-between"><h2 style="font-family:Nunito">Create student account.</h2><button class="btn btn-ghost" onclick="closeModal()">✕</button></div><div class="form"><input id="rname" class="input" placeholder="Your name"><input id="remail" class="input" placeholder="Email"><input id="rpass" type="password" class="input" placeholder="Password (6+ characters)"><button class="btn btn-yellow" onclick="register()">Create account</button><button class="btn btn-ghost" onclick="openLogin()">Back to login</button></div></div>`}
async function login(){try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value,password:$('#password').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Login failed');me=d.user;closeModal();route(activeView)}catch(e){alert(e.message)}}
async function register(){try{const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#rname').value,email:$('#remail').value,password:$('#rpass').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Registration failed');me=d.user;closeModal();renderHome()}catch(e){alert(e.message)}}
async function logout(){await fetch('/api/logout',{method:'POST'});me=null;route('home')} function closeModal(){$('#modal').classList.add('hidden')}
async function loadJson(url,fallback){try{const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(url+' '+r.status);return await r.json()}catch(e){console.warn('Data load warning:',url,e.message);return fallback}}
async function boot(){const [v,tb,e,tr]=await Promise.all([loadJson('/vocab.json',[]),loadJson('/quizzes.json',[]),loadJson('/explanations.json',[]),loadJson('/trilingual.json',[])]);vocab=Array.isArray(v)?v:[];tests=Array.isArray(tb)?tb:[];explanations=Array.isArray(e)?e:[];tri=Array.isArray(tr)?tr:[];const m=await fetch('/api/me',{cache:'no-store'}).then(r=>r.json()).catch(()=>({user:null}));me=m.user||null;renderHome()}
window.addEventListener('DOMContentLoaded',()=>boot().catch(e=>{console.error(e);$('#app').innerHTML=`<main class="appview"><div class="notice">Unable to load platform data: ${esc(e.message)}</div></main>`}));
</script></body></html>
